name: Build and Release Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Inject Dummy Keys if Missing
        run: |
          # ساخت مقادیر پیش‌فرض برای جلوگیری از توقف گریدل روی کلیدهای تلگرام
          mkdir -p TMessagesProj/config
          cat << 'EOF' > TMessagesProj/config/debug.properties
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb9890f104d9
          EOF

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Print Fatal Errors on Failure
        if: failure()
        run: |
          echo "=================== خطای دقیق گریدل ==================="
          grep -B 2 -A 10 "FAILURE: Build failed" build_log.txt || true
          grep -B 2 -A 10 "What went wrong:" build_log.txt || true
          grep -E "error:|Task .* FAILED" build_log.txt || true
          echo "======================================================="

      - name: Locate and Stage APK
        id: stage_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" ! -name "*unaligned*" ! -name "*androidTest*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ فایلی یافت نشد."
            exit 1
          fi
          mkdir -p release_files
          cp "$APK_PATH" release_files/Germa-Custom.apk
          echo "apk_exists=true" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.stage_apk.outputs.apk_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Germa Custom APK Build #${{ github.run_number }}"
          body: "فایل خروجی تلگرام Germa"
          files: release_files/Germa-Custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
