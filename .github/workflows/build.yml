name: Build and Release Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36, NDK 27 and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Generate Valid Keystore and Setup Configs
        run: |
          mkdir -p TMessagesProj/config
          
          # تولید خودکار یک کلید امضای معتبر بدون نیاز به کلیدهای نامشخص
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias germa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Germa, OU=App, O=Telegram, L=City, S=State, C=US"

          # تنظیم مشخصات کلید در gradle.properties
          echo "RELEASE_KEY_PASSWORD=123456" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=germa" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=123456" >> gradle.properties

          # تنظیم متغیرهای پایه تلگرام
          cat << 'EOF' > TMessagesProj/config/debug.properties
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb9890f104d9
          EOF

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Afat Debug APK
        run: |
          ./gradlew assembleAfatDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Print Fatal Errors on Failure
        if: failure()
        run: |
          echo "=================== خطای دقیق گریدل ==================="
          grep -B 2 -A 10 "FAILURE: Build failed" build_log.txt || true
          grep -B 2 -A 10 "What went wrong:" build_log.txt || true
          grep -E "error:|Task .* FAILED" build_log.txt || true
          echo "======================================================="

      - name: Locate and Stage APK
        id: stage_apk
        run: |
          APK_PATH=$(find . -type f -name "*afat*debug*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" ! -name "*unaligned*" ! -name "*androidTest*" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "❌ هیچ فایل APK یافت نشد."
            exit 1
          fi
          echo "✅ فایل APK با موفقیت در این مسیر تولید شد: $APK_PATH"
          mkdir -p release_files
          cp "$APK_PATH" release_files/Germa-Custom.apk
