name: Build and Release Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :TMessagesProj:assembleAfatDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Locate and Stage APK
        id: stage_apk
        run: |
          echo "🔍 در حال جستجوی فایل‌های APK ساخته شده..."
          find . -type f -name "*.apk"
          
          APK_PATH=$(find . -type f -name "*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ خطا: فایل APK تولید نشد. خروجی مرحله بیلد را بررسی کنید."
            exit 1
          fi
          echo "✅ فایل پیدا شد: $APK_PATH"
          mkdir -p release_files
          cp "$APK_PATH" release_files/Germa-Custom.apk
          echo "apk_exists=true" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.stage_apk.outputs.apk_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Germa Custom APK Build #${{ github.run_number }}"
          body: "فایل APK سفارشی تلگرام"
          draft: false
          prerelease: false
          files: release_files/Germa-Custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
