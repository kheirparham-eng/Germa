name: Build and Release Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # فعال‌سازی کش گریدل برای بالا بردن سرعت دانلود پکیج‌ها و تسک‌های تکراری
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK 36, NDK 27 and CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup Keystore and Base Configs
        run: |
          mkdir -p TMessagesProj/config
          
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias germa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Germa, OU=App, O=Telegram, L=City, S=State, C=US"

          echo "RELEASE_KEY_PASSWORD=123456" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=germa" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=123456" >> gradle.properties

          cat << 'EOF' > TMessagesProj/config/debug.properties
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb9890f104d9
          EOF

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # بیلد منحصراً برای معماری arm64 (گوشی‌های مدرن) با اختصاص موازی‌سازی و حافظه رم
      - name: Fast Build Debug APK (ARM64 only)
        run: |
          ./gradlew assembleAfatDebug \
            -PabiFilters=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx6144m -XX:+UseParallelGC" \
            --parallel \
            --no-daemon \
            --stacktrace

      - name: Prepare, Zipalign, and Sign APK
        run: |
          mkdir -p release_files
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"

          RAW_APK=$(find . -type f -name "*.apk" ! -name "*unaligned*" ! -name "*androidTest*" | head -n 1)

          if [ -z "$RAW_APK" ]; then
            echo "❌ فایل ساخته نشد!"
            exit 1
          fi

          echo "فایل پیدا شد: $RAW_APK"

          ${BUILD_TOOLS}/zipalign -f -p 4 "$RAW_APK" release_files/aligned.apk

          ${BUILD_TOOLS}/apksigner sign --ks TMessagesProj/config/release.keystore \
            --ks-pass pass:123456 \
            --ks-key-alias germa \
            --key-pass pass:123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release_files/Germa-Telegram.apk \
            release_files/aligned.apk

          ${BUILD_TOOLS}/apksigner verify --verbose release_files/Germa-Telegram.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Germa Custom Telegram Fast-Build #${{ github.run_number }}"
          body: "نسخه سریع و بهینه‌شده تلگرام Germa (مخصوص معماری ARM64 - پایدار و کم‌حجم)."
          draft: false
          prerelease: false
          files: release_files/Germa-Telegram.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
